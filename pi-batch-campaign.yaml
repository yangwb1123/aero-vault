# aero-vault 维护 campaign（由 ~/ai-batch-runner 工具集驱动）。
# 运行：cd ~/aero-vault && python ~/ai-batch-runner/pi-batch.py campaign \
#         --config pi-batch-campaign.yaml --top-only --reuse --skip-passed --retry-failed
name: aero-vault-maintenance

discovery:
  roots:
    - internal
    - cmd
    - sdk
  exclude:
    - testdata
    - gen
    - generated
    - mock
    - tests
    - docs
    - examples
    - vendor
    - .git
    - .github
    - .pi-batch
    - __pycache__
    - ai-dev
  max_depth: 1
  # 顶层目录已显式列出，无需 fallback。
  fallback_top_level: false

analysis:
  jobs: 4
  retries: 2
  candidate_limit: 3
  prompt: |
    Analyze module '{module}' at {module_path} of aero-vault — a Go object
    storage server (REST /v1 + S3 + WebDAV + MCP, SQLite/Postgres, local/S3
    storage, AI search, event bus + webhooks, reconciliation). Hard gates:
    `make check` (gofmt/build/vet/test/filesize ≤500 lines per file).
    Return ONLY a JSON array with at most {candidate_limit} high-value
    improvement directions, sorted by value. Directions may be defect fixes
    (bugs, races, missing validation, error-path gaps, test gaps) or new
    features (small, self-contained, within module responsibility).
    Each object must contain: title, problem, value (1-10),
    risk_reduction (1-10), effort (1-10), confidence (1-10),
    evidence (existing file/symbol paths), and acceptance (testable checks).
    Do not modify code. Claims without repository evidence must be
    identified as proposed, not verified.

selection:
  max_directions: 1
  minimum_score: 0

implementation:
  pipeline: pi-batch-campaign-pipeline.yaml
  requirement_stage: requirements
  concurrency: 1
  # Hard wall-clock limit for each isolated direction pipeline.
  timeout: 14400
  worktree_root: .pi-batch/worktrees

state:
  output_dir: docs/auto
  state_file: docs/auto/state.jsonl
  summary_file: docs/auto/SUMMARY.md
  line_max_bytes: 262144

estimates:
  analysis_minutes: 3
  pipeline_minutes: 25
