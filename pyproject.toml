[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "aero-vault-engineering"
version = "0.1.0"
description = "aero-vault engineering CLI and checks"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
aero-vault-cli = "cli:main"
