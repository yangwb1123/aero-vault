name: Docker

on:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    name: build (and conditionally push) image
    runs-on: ubuntu-latest
    env:
      # Push only when registry credentials are configured as repo secrets.
      # Empty (secrets absent) → build-only, no login, no push.
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      IMAGE_NAME: ${{ secrets.REGISTRY_IMAGE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Decide whether to push
        id: gate
        run: |
          if [ -n "$REGISTRY_USERNAME" ] && [ -n "$IMAGE_NAME" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Registry secrets not set — building image without pushing."
          fi

      - name: Log in to registry
        if: steps.gate.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME || 'aero-vault' }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.gate.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
