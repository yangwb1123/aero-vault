name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build · vet · test · engineering-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python deps
        run: pip install pyyaml

      - name: Install Go analysis tools
        run: go install github.com/fzipp/gocyclo/cmd/gocyclo@latest

      # ── Engineering gates (centralised in cli.py + engineering.yaml) ──

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt 格式检查:"
            echo "$unformatted"
            exit 1
          fi

      - name: Root directory policy
        run: python3 cli.py root-policy

      - name: File size (≤ 500 lines)
        run: python3 cli.py check-filesize

      - name: Engineering invariants (I1–I6)
        run: python3 cli.py invariants

      - name: ADR compliance
        run: python3 cli.py adr-compliance

      - name: Cyclomatic complexity
        run: python3 cli.py complexity

      - name: Exemption sync
        run: python3 cli.py check-exemptions

      # ── Go build & test ──

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        # -tags=integration: type-checks integration-tagged test files too
        # (go vet compiles *_test.go; go build does not). Zero-Docker —
        # compile-only, no DB connection.
        run: go vet -tags=integration ./...

      - name: Test
        run: go test ./...

      - name: Test (race — metadata atomicity + audit-governance cache)
        run: go test -race -count=1 -timeout 300s ./internal/repository/ ./internal/reconcile/ ./internal/auditgovernance/

      - name: Test (race — thumbnail decode semaphore, short mode)
        # The aggregate-memory A1 test needs ~1.2 GiB and ~97s under -race;
        # -short skips it while the deterministic slot-contract tests
        # (blocking/release-on-error/release-on-panic) still run.
        run: go test -race -short -count=1 -timeout 180s ./internal/thumbnail/

      - name: Test (race — thumbnail mid-decode ctx identity, REST)
        # The mid-decode REST tests (TestThumbnailMidDecode*) drive the
        # handler through a ctx-bound storage stream with goroutine+handshake
        # concurrency — exactly the pattern the race detector exists for
        # (QA-5). The 304-revalidation tests reuse the mutex-guarded
        # etagSwapRepo seam (swap/fail arms), so they race under the same
        # detector too. Close-lifecycle tests cover the source-close/error
        # path and are included explicitly rather than by incidental naming.
        # Scoped via -run so the full REST package is not covered here.
        run: go test -race -short -count=1 -timeout 120s ./internal/api/rest/ -run 'TestThumbnailMidDecode|TestThumbnail304RevalidatesAfterStat|TestThumbnail304ShortCircuitsBeforeOpen|TestThumbnailGeneration|TestThumbnailClose'

      - name: Coverage
        run: |
          echo "::group::覆盖率报告"
          go test -coverprofile=/tmp/cover.out ./...
          go tool cover -func=/tmp/cover.out | tail -3
          echo "::endgroup::"

      - name: SDK Go build
        run: cd sdk/go/aerovault && go build ./...

      - name: E2E tests (with server)
        run: |
          go build -o /tmp/av-e2e ./cmd/server
          APP_ADDR=:9199 /tmp/av-e2e &
          sleep 2
          BASE_URL=http://localhost:9199 python3 tests/run_all.py
          kill %1 2>/dev/null || true

  fuzz-thumbnail:
    name: fuzz (thumbnail — bounded fuzztime, 5 targets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Fuzz-found crashers are written to the testdata corpus by `go test
    # -fuzz`; persisting the artifact makes them recoverable and commitable
    # (DevOps High: a CI-only crasher is a silent DoS regression).
    permissions:
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz FuzzGenerate
        run: go test -fuzz=FuzzGenerate -run '^$' -fuzztime=30s ./internal/thumbnail/

      - name: Fuzz FuzzPNGOrientation
        run: go test -fuzz=FuzzPNGOrientation -run '^$' -fuzztime=30s ./internal/thumbnail/

      - name: Fuzz FuzzExifOrientation
        run: go test -fuzz=FuzzExifOrientation -run '^$' -fuzztime=30s ./internal/thumbnail/

      - name: Fuzz FuzzProgressiveJPEG
        run: go test -fuzz=FuzzProgressiveJPEG -run '^$' -fuzztime=30s ./internal/thumbnail/

      - name: Fuzz FuzzGenerateBudgets
        run: go test -fuzz=FuzzGenerateBudgets -run '^$' -fuzztime=30s ./internal/thumbnail/

      - name: Fuzz the 4 targets on 32-bit int (TIFF wrap class, GOARCH=386, serial)
        # -parallel=1 keeps the 386 run deterministic under the race-free
        # channel semantics; the corpus files land in testdata/fuzz and are
        # picked up by the amd64 seed phase of the next run.
        run: GOARCH=386 go test -fuzz=FuzzExifOrientation -run '^$' -fuzztime=30s -parallel=1 ./internal/thumbnail/ && GOARCH=386 go test -fuzz=FuzzProgressiveJPEG -run '^$' -fuzztime=30s -parallel=1 ./internal/thumbnail/ && GOARCH=386 go test -fuzz=FuzzPNGOrientation -run '^$' -fuzztime=30s -parallel=1 ./internal/thumbnail/

      - name: Reproduce pinned crashers (both word sizes)
        run: go test -run 'TestFuzzCorpusReproduction' -count=1 ./internal/thumbnail/ && GOARCH=386 go test -run 'TestFuzzCorpusReproduction' -count=1 ./internal/thumbnail/

      - name: Upload fuzz corpus (crashers recoverable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thumbnail-fuzz-corpus
          path: internal/thumbnail/testdata/fuzz/
          if-no-files-found: ignore
