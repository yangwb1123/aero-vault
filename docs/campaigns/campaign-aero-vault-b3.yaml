# aero-vault B3 批次实施 campaign（死信/Ready 解耦/确定性 ID）
# 前置：docs/proposals/audit-contract-batch-aero-vault.md（提案，运行中）
# 批次内容（implementation-gate.md B3）：
#   1. 死信终态（F3）：0039 迁移扩展 status/dead_at + 部分索引；Permanent
#      分类（422/409/tenant mismatch → 终态 ≤1 次尝试）；瞬态有界重试
#      cap 300s；dead 行排除出 claim/lag（T-3）
#   2. Ready 解耦（H1）：maxLag 翻转 → degraded + 450s 告警；终态行排除
#      OldestPending；读路径超时降级非 503（D1 drill）
#   3. 确定性 fact ID（F4）：SHA-256(source|tenant|event_type|origin_kind|
#      origin_id|time_bucket)[:32]；gap reconcile 复用（T-4）
#   4. Relay metrics（H6）：attempted/delivered/failed/dead/oldest-age
#   5. scope 对齐（F2 收尾）：已 enforce audit:event:write——补矩阵配给
#      端到端验证 + grep 一致性检查
#   6. 激活门（F-03）：AUDIT_GOVERNANCE_ENABLED=true + bindings + 首个事件
# 门禁：G4（B3-1..6：T-3/T-4/D1 drill/首个事件 e2e）
# 用法（aero-vault 仓库内）：
#   python3 pi-batch.py campaign --config docs/campaigns/campaign-aero-vault-b3.yaml --dry-run
#   python3 pi-batch.py campaign --config docs/campaigns/campaign-aero-vault-b3.yaml \
#     --jobs 4 --max-directions 2 --validate gobuild,gotest,pyquality

name: aero-vault-b3-dead-state

discovery:
  roots:
    - internal
    - cmd
    - migrations
  exclude:
    - testdata
    - gen
    - generated
    - mock
    - tests
    - docs
    - examples
    - logs
    - vendor
    - .git
    - .pi-batch
    - __pycache__
    - ai-dev
  max_depth: 2
  fallback_top_level: true

analysis:
  jobs: 4
  retries: 2
  candidate_limit: 3
  prompt: |
    Analyze module '{module}' at {module_path} of aero-vault (file
    platform, Go, audit via internal/auditgovernance). An approved
    contract (audit v2.1, GATE PASSED) assigns batch B3 (gate G4):
    (1) dead-letter terminal state: 0039_audit_governance_outbox
    migration gains status/dead_at columns + partial index; Permanent
    error classification (422/409/tenant mismatch/invalid receipt →
    terminal within ≤1 attempt); transient bounded retry cap 300s;
    dead rows excluded from claim/lag (T-3), (2) Ready() decoupling:
    maxLag flip becomes degraded + 450s alert; terminal rows excluded
    from OldestPending; read-path timeouts degrade instead of 503
    (D1 drill), (3) deterministic fact IDs: SHA-256(source|tenant|
    event_type|origin_kind|origin_id|time_bucket)[:32] at the three
    fact constructors; gap reconcile reuse (T-4), (4) relay metrics
    attempted/delivered/failed/dead/oldest-age, (5) scope alignment
    (already enforcing audit:event:write — add matrix-provisioned
    end-to-end verification + grep consistency), (6) activation gate
    (AUDIT_GOVERNANCE_ENABLED=true + bindings + first-event e2e).
    Return ONLY a JSON array with at most {candidate_limit} high-value
    directions toward B3, sorted by value. Each object must contain:
    title, problem, value (1-10), risk_reduction (1-10), effort (1-10),
    confidence (1-10), evidence (existing file/symbol paths), and
    acceptance (testable checks mapping to T-3/T-4/D1). Do not modify
    code. Claims without repository evidence must be identified as
    proposed, not verified.

selection:
  max_directions: 2
  minimum_score: 0

implementation:
  pipeline: examples/repository-campaign-pipeline.yaml
  requirement_stage: requirements
  concurrency: 1
  timeout: 14400
  worktree_root: .pi-batch/worktrees

state:
  output_dir: docs/auto
  state_file: docs/auto/state.jsonl
  summary_file: docs/auto/SUMMARY.md
  line_max_bytes: 262144

estimates:
  analysis_minutes: 3
  pipeline_minutes: 25
