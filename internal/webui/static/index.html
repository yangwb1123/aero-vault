<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>aero-vault console</title>
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; margin: 0; background: #0e1116; color: #d8e1eb; }
  header { display: flex; gap: 12px; align-items: center; padding: 14px 20px; background: #181d25; border-bottom: 1px solid #232a35; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header input, header select { background: #0e1116; color: #d8e1eb; border: 1px solid #2d3744; padding: 6px 10px; border-radius: 6px; font-size: 13px; }
  main { display: grid; grid-template-columns: 320px 1fr; gap: 0; height: calc(100vh - 56px); }
  aside { border-right: 1px solid #232a35; overflow: auto; }
  section { padding: 16px 22px; overflow: auto; }
  .group { padding: 14px 18px; border-bottom: 1px solid #232a35; }
  .group h3 { margin: 0 0 10px 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: #8a96a8; }
  button { background: #1f7adb; color: white; border: none; padding: 7px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  button:hover { background: #2588f0; }
  button.ghost { background: transparent; border: 1px solid #2d3744; color: #d8e1eb; }
  .file-list { font-size: 13px; }
  .file-row { padding: 8px 10px; cursor: pointer; border-bottom: 1px solid #1a2029; display: flex; justify-content: space-between; }
  .file-row:hover { background: #1a2029; }
  .file-row .size { color: #8a96a8; font-size: 11px; }
  textarea, input[type=text] { width: 100%; background: #0e1116; color: #d8e1eb; border: 1px solid #2d3744; padding: 8px; border-radius: 6px; font-family: inherit; font-size: 13px; }
  pre { background: #0a0d12; padding: 14px; border-radius: 6px; overflow: auto; font-size: 12px; line-height: 1.5; border: 1px solid #1a2029; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 9999px; background: #1f7adb33; color: #6db8ff; font-size: 11px; }
  .hit { padding: 12px 14px; border-bottom: 1px solid #1a2029; }
  .hit .score { font-size: 11px; color: #8a96a8; }
  .hit .src { font-size: 12px; color: #6db8ff; margin-top: 4px; }
  .hit .text { margin-top: 6px; white-space: pre-wrap; font-size: 13px; line-height: 1.5; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tab { padding: 6px 12px; background: #181d25; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .tab.active { background: #1f7adb; color: white; }
  label { font-size: 12px; color: #8a96a8; }
  .drop-active { background: #1a2b40; }
</style>
</head>
<body>
<header>
  <h1>aero-vault</h1>
  <label>tenant <input id="tenant" type="text" value="default" style="width: 110px"></label>
  <label>token <input id="apikey" type="password" placeholder="API key or OIDC token" style="width: 200px"></label>
  <span class="pill" id="auth-status">local</span>
  <span style="flex:1"></span>
  <button id="oidc-login" onclick="oidcLogin()">Snaplink login</button>
  <button class="ghost" id="oidc-logout" onclick="oidcLogout()" style="display:none">logout</button>
  <button onclick="refresh()">refresh</button>
</header>
<main>
  <aside ondragover="event.preventDefault()" ondrop="handleDrop(event)" ondragenter="this.classList.add('drop-active')" ondragleave="this.classList.remove('drop-active')">
    <div class="group">
      <h3>upload</h3>
      <input id="up-key" type="text" placeholder="key (e.g. docs/note.md)" style="margin-bottom: 8px">
      <input id="up-file" type="file" style="font-size: 12px; margin-bottom: 8px">
      <button onclick="upload()">upload</button>
    </div>
    <div class="group" id="file-list-wrap">
      <h3>objects <span class="pill" id="count">0</span></h3>
      <input id="prefix" type="text" placeholder="prefix filter" oninput="refresh()" style="margin-bottom: 8px">
      <div class="file-list" id="files"></div>
    </div>
  </aside>
  <section>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('search')" id="t-search">semantic search</div>
      <div class="tab" onclick="switchTab('detail')" id="t-detail">object detail</div>
      <div class="tab" onclick="switchTab('lineage')" id="t-lineage">lineage</div>
      <div class="tab" onclick="switchTab('chat')" id="t-chat">chat</div>
      <div class="tab" onclick="switchTab('access')" id="t-access">access &amp; sharing</div>
    </div>
    <div id="pane-search">
      <div style="display:flex; gap: 8px; margin-bottom: 12px">
        <input id="q" type="text" placeholder="e.g. 'localhost loopback addresses'" onkeydown="if(event.key=='Enter')doSearch()">
        <select id="mode">
          <option value="vector">vector</option>
          <option value="bm25">bm25</option>
          <option value="hybrid">hybrid</option>
        </select>
        <button onclick="doSearch()">search</button>
      </div>
      <div id="hits"></div>
    </div>
    <div id="pane-detail" style="display:none">
      <pre id="detail">select an object on the left</pre>
    </div>
    <div id="pane-lineage" style="display:none">
      <input id="lin-id" type="text" placeholder="object id" style="margin-bottom: 8px; width: 200px">
      <button onclick="loadLineage()">load</button>
      <pre id="lineage" style="margin-top: 12px">enter object id and click load</pre>
    </div>
    <div id="pane-chat" style="display:none">
      <div style="display:flex; gap: 8px; margin-bottom: 12px">
        <input id="cq" type="text" placeholder="ask a question about your files…" onkeydown="if(event.key=='Enter')doChat()">
        <select id="cmode">
          <option value="vector">vector</option>
          <option value="bm25">bm25</option>
          <option value="hybrid">hybrid</option>
        </select>
        <button onclick="doChat()">ask</button>
      </div>
      <div id="chat-resp" style="white-space: pre-wrap; font-size: 13px; line-height: 1.6; padding: 12px 14px; background: #0a0d12; border: 1px solid #1a2029; border-radius: 6px; min-height: 80px; margin-bottom: 12px"></div>
      <div id="chat-cites"></div>
    </div>
    <div id="pane-access" style="display:none">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div>
          <h3>share / publish / backup</h3>
          <label>object key</label><input id="access-key" type="text" placeholder="blog/hero.jpg">
          <div style="display:flex;gap:8px;margin:8px 0;flex-wrap:wrap">
            <button class="ghost" onclick="downloadObject()">download</button>
            <button class="ghost" onclick="createPresignedGet()">presigned GET</button>
            <button class="ghost" onclick="deleteObject()">soft delete</button>
            <button class="ghost" onclick="restoreObject()">restore</button>
          </div>
          <label>share password (optional)</label><input id="share-password" type="text">
          <div style="display:flex;gap:8px;margin:8px 0">
            <input id="share-ttl" type="text" value="3600" placeholder="TTL seconds">
            <button onclick="createShare()">create share</button>
          </div>
          <div style="display:flex;gap:8px;margin-bottom:8px">
            <input id="share-id" type="text" placeholder="share id to revoke">
            <button class="ghost" onclick="listShares()">list</button>
            <button class="ghost" onclick="revokeShare()">revoke</button>
          </div>
          <label>public image slug</label><input id="asset-slug" type="text" placeholder="blog/hero.jpg">
          <div style="display:flex;gap:8px;margin-top:8px">
            <button onclick="publishAsset()">publish image</button>
            <button class="ghost" onclick="listAssets()">list</button>
            <button class="ghost" onclick="unpublishAsset()">unpublish</button>
          </div>
          <div style="display:flex;gap:8px;margin-top:14px">
            <input id="export-prefix" type="text" placeholder="backup prefix">
            <button onclick="exportBackup()">export backup</button>
          </div>
        </div>
        <div>
          <h3>department / resource ACL</h3>
          <div style="display:flex;gap:8px">
            <input id="dept-name" type="text" placeholder="department name">
            <input id="dept-parent-id" type="text" placeholder="parent id (optional)">
            <button onclick="createDepartment()">create</button>
          </div>
          <div style="display:flex;gap:8px;margin:8px 0">
            <input id="dept-id" type="text" placeholder="department id">
            <button class="ghost" onclick="listDepartments()">list</button>
            <button class="ghost" onclick="getDepartment()">get</button>
            <button class="ghost" onclick="deleteDepartment()">delete</button>
          </div>
          <label>department membership</label>
          <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:8px">
            <input id="member-dept-id" type="text" placeholder="department id">
            <input id="member-subject-id" type="text" placeholder="user subject id">
            <button onclick="putDepartmentMember()">add</button>
          </div>
          <button class="ghost" onclick="deleteDepartmentMember()" style="margin:8px 0">remove member</button>
          <label>resource kind / principal type</label>
          <div style="display:flex;gap:8px">
            <select id="acl-kind"><option>object</option><option>folder</option><option>bucket</option></select>
            <select id="acl-principal"><option>user</option><option>department</option><option>group</option><option>role</option><option>authenticated</option><option>everyone</option></select>
            <select id="acl-effect"><option>allow</option><option>deny</option></select>
          </div>
          <input id="acl-principal-id" type="text" placeholder="principal subject / department id" style="margin-top:8px">
          <input id="acl-actions" type="text" value="object:read,object:download" placeholder="comma-separated actions" style="margin-top:8px">
          <label><input id="acl-inherit" type="checkbox"> inherit into descendants</label>
          <div style="display:flex;gap:8px;margin-top:8px">
            <button onclick="putResourceACL()">save ACL</button>
            <button class="ghost" onclick="listResourceACL()">list ACL</button>
          </div>
          <div style="display:flex;gap:8px;margin-top:8px">
            <input id="acl-id" type="text" placeholder="ACL entry id">
            <button class="ghost" onclick="deleteResourceACL()">delete ACL</button>
          </div>
        </div>
      </div>
      <pre id="access-result" style="margin-top:16px">select an object or enter a key</pre>
    </div>
  </section>
</main>
<script>
function jwtClaims(token) {
  try {
    const encoded = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(encoded.padEnd(Math.ceil(encoded.length / 4) * 4, '='));
    const bytes = Uint8Array.from(raw, c => c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  } catch (_) {
    return {};
  }
}

function acceptOIDCCallback() {
  const fragment = new URLSearchParams(location.hash.slice(1));
  const token = fragment.get('oidc_access_token');
  if (!token) return;
  localStorage.setItem('aero_apikey', token);
  localStorage.setItem('aero_oidc_token', token);
  const idToken = fragment.get('oidc_id_token');
  if (idToken) localStorage.setItem('aero_oidc_id_token', idToken);
  const expiresIn = Number(fragment.get('oidc_expires_in') || 0);
  if (expiresIn > 0) localStorage.setItem('aero_oidc_expires_at', String(Date.now() + expiresIn * 1000));
  const claims = jwtClaims(token);
  const tokenTenant = claims.tenant_id || claims.ten;
  if (tokenTenant) localStorage.setItem('aero_tenant', tokenTenant);
  history.replaceState(null, '', location.pathname + location.search);
}

acceptOIDCCallback();
const tenantInp = document.getElementById('tenant');
const apiInp = document.getElementById('apikey');
tenantInp.value = localStorage.getItem('aero_tenant') || 'default';
apiInp.value    = localStorage.getItem('aero_apikey') || '';
tenantInp.oninput = () => { localStorage.setItem('aero_tenant', tenantInp.value); refresh(); };
apiInp.oninput    = () => {
  localStorage.setItem('aero_apikey', apiInp.value);
  if (apiInp.value !== localStorage.getItem('aero_oidc_token')) clearOIDCState();
  renderAuthState();
};

function clearOIDCState() {
  ['aero_oidc_token','aero_oidc_id_token','aero_oidc_expires_at'].forEach(k => localStorage.removeItem(k));
}

function renderAuthState() {
  const signedIn = !!localStorage.getItem('aero_oidc_token');
  document.getElementById('auth-status').textContent = signedIn ? 'Snaplink SSO' : 'local token';
  document.getElementById('oidc-login').style.display = signedIn ? 'none' : '';
  document.getElementById('oidc-logout').style.display = signedIn ? '' : 'none';
}

function oidcLogin() {
  location.assign('/auth/oidc/login');
}

function oidcLogout() {
  clearOIDCState();
  localStorage.removeItem('aero_apikey');
  location.assign('/auth/oidc/logout');
}

renderAuthState();

function headers(extra) {
  const h = { 'X-Aero-Tenant': tenantInp.value || 'default', ...(extra || {}) };
  if (apiInp.value) h['Authorization'] = 'Bearer ' + apiInp.value;
  return h;
}

function switchTab(name) {
  ['search','detail','lineage','chat','access'].forEach(n => {
    document.getElementById('t-'+n).classList.toggle('active', n === name);
    document.getElementById('pane-'+n).style.display = n === name ? '' : 'none';
  });
}

function el(tag, props, ...children) {
  const e = document.createElement(tag);
  if (props) Object.assign(e, props);
  for (const c of children) {
    if (c == null) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}

async function refresh() {
  const prefix = document.getElementById('prefix').value;
  const r = await fetch('/v1/files?prefix=' + encodeURIComponent(prefix) + '&limit=200', { headers: headers() });
  const data = await r.json();
  const wrap = document.getElementById('files');
  wrap.replaceChildren();
  const objs = (data && data.objects) || [];
  document.getElementById('count').textContent = String(objs.length);
  for (const o of objs) {
    const row = el('div', { className: 'file-row' },
      el('span', null, o.key),
      el('span', { className: 'size' }, String(o.size) + 'b'));
    row.onclick = () => showDetail(o);
    wrap.appendChild(row);
  }
}

async function showDetail(obj) {
  document.getElementById('access-key').value = obj.key;
  document.getElementById('asset-slug').value = obj.key;
  switchTab('detail');
  const r = await fetch('/v1/files/' + encodePath(obj.key), { headers: headers() });
  const body = await r.text();
  const tags = await fetch('/v1/files/' + encodePath(obj.key) + '/tags', { headers: headers() }).then(r => r.json()).catch(() => ({}));
  const versions = await fetch('/v1/files/' + encodePath(obj.key) + '/versions', { headers: headers() }).then(r => r.json()).catch(() => ({}));
  document.getElementById('detail').textContent =
    '== metadata ==\n' + JSON.stringify(obj, null, 2) +
    '\n\n== tags ==\n' + JSON.stringify(tags, null, 2) +
    '\n\n== versions ==\n' + JSON.stringify(versions, null, 2) +
    '\n\n== content (first 4KB) ==\n' + body.slice(0, 4096);
}

async function accessJSON(path, method, body) {
  const r = await fetch(path, { method, headers: headers({ 'Content-Type': 'application/json' }), body: body ? JSON.stringify(body) : undefined });
  const text = await r.text();
  let data; try { data = text ? JSON.parse(text) : { status: r.status }; } catch (_) { data = { status: r.status, body: text }; }
  document.getElementById('access-result').textContent = JSON.stringify(data, null, 2);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return data;
}

async function upload() {
  const key = document.getElementById('up-key').value || document.getElementById('up-file').files[0]?.name;
  const file = document.getElementById('up-file').files[0];
  if (!key || !file) { alert('key + file required'); return; }
  const r = await fetch('/v1/files/' + encodePath(key), { method: 'PUT', headers: headers({ 'Content-Type': file.type || 'application/octet-stream' }), body: file });
  if (!r.ok) { alert('upload failed: HTTP ' + r.status); return; }
  document.getElementById('up-key').value = '';
  document.getElementById('up-file').value = '';
  refresh();
}

async function doSearch() {
  const q = document.getElementById('q').value;
  if (!q) return;
  const mode = document.getElementById('mode').value;
  const r = await fetch('/v1/search', { method: 'POST', headers: headers({ 'Content-Type': 'application/json' }), body: JSON.stringify({ query: q, k: 5, mode }) });
  const data = await r.json();
  const wrap = document.getElementById('hits');
  wrap.replaceChildren();
  const hits = (data && data.hits) || [];
  if (hits.length === 0) {
    wrap.appendChild(el('p', { style: 'color:#8a96a8' }, 'no hits'));
    return;
  }
  for (const h of hits) {
    const div = el('div', { className: 'hit' },
      el('div', { className: 'score' }, 'score ' + (h.score || 0).toFixed(4) + '  ·  ' + (h.embed_model || '')),
      el('div', { className: 'src' }, (h.bucket || '') + '/' + (h.object_key || '') + '#chunk-' + (h.seq || 0)),
      el('div', { className: 'text' }, h.chunk || ''));
    wrap.appendChild(div);
  }
}

async function loadLineage() {
  const id = document.getElementById('lin-id').value;
  if (!id) return;
  const r = await fetch('/v1/lineage/objects/' + encodeURIComponent(id), { headers: headers() });
  const data = await r.json();
  document.getElementById('lineage').textContent = JSON.stringify(data, null, 2);
}

function encodePath(k) { return k.split('/').map(encodeURIComponent).join('/'); }

async function doChat() {
  const q = document.getElementById('cq').value.trim();
  if (!q) return;
  const mode = document.getElementById('cmode').value;
  const respEl = document.getElementById('chat-resp');
  const citesEl = document.getElementById('chat-cites');
  respEl.textContent = '';
  citesEl.replaceChildren();

  const resp = await fetch('/v1/chat/stream', {
    method: 'POST',
    headers: headers({ 'Content-Type': 'application/json' }),
    body: JSON.stringify({ query: q, k: 5, mode })
  });
  if (!resp.ok) {
    respEl.textContent = 'Error: HTTP ' + resp.status;
    return;
  }

  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();
    let evtType = 'message';
    for (const line of lines) {
      if (line.startsWith('event: ')) { evtType = line.slice(7).trim(); continue; }
      if (line.startsWith('data: ')) {
        const data = line.slice(6);
        if (evtType === 'token') {
          try {
            const token = JSON.parse(data);
            respEl.textContent += typeof token === 'string' ? token : String(token);
          } catch (_) {
            respEl.textContent += data;
          }
        } else if (evtType === 'done') {
          try {
            const obj = JSON.parse(data);
            if (!respEl.textContent && obj.answer) respEl.textContent = obj.answer;
            const hits = obj.citations || [];
            for (const h of hits) {
              const div = el('div', { className: 'hit' },
                el('div', { className: 'src' }, (h.bucket || '') + '/' + (h.object_key || '') + ' #' + (h.seq ?? '')),
                el('div', { className: 'text' }, h.chunk || ''));
              citesEl.appendChild(div);
            }
          } catch (_) {}
        } else if (evtType === 'error') {
          try {
            const obj = JSON.parse(data);
            respEl.textContent += '\n[Error: ' + (obj.message || data) + ']';
          } catch (_) { respEl.textContent += '\n[Error: ' + data + ']'; }
        }
        evtType = 'message';
      }
    }
  }
}

async function handleDrop(ev) {
  ev.preventDefault();
  ev.currentTarget.classList.remove('drop-active');
  const files = [...(ev.dataTransfer.files || [])];
  for (const file of files) {
    const key = file.name;
    await fetch('/v1/files/' + encodePath(key), {
      method: 'PUT',
      headers: headers({ 'Content-Type': file.type || 'application/octet-stream' }),
      body: file
    });
  }
  refresh();
}

refresh();
</script>
<script src="/ui/enterprise.js"></script>
</body>
</html>
