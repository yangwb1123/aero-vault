apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aero-vault.fullname" . }}
  labels:
    {{- include "aero-vault.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "aero-vault.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll pods when the rendered config/secret changes.
        checksum/config: {{ .Values.config | toYaml | sha256sum }}
        checksum/secret: {{ .Values.secrets | toYaml | sha256sum }}
        checksum/audit-governance: {{ .Values.auditGovernance | toYaml | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "aero-vault.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # Covers the relay's maximum 60s lease plus its maximum 29s HTTP bound.
      terminationGracePeriodSeconds: 95
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "aero-vault.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "aero-vault.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "aero-vault.fullname" . }}
            {{- if or .Values.existingSecret .Values.secrets }}
            - secretRef:
                name: {{ include "aero-vault.secretName" . }}
            {{- end }}
          {{- if or .Values.auditGovernance.enabled .Values.extraEnv }}
          env:
            {{- if .Values.auditGovernance.enabled }}
            - name: AUDIT_GOVERNANCE_ENABLED
              value: "true"
            - name: AUDIT_GOVERNANCE_BASE_URL
              value: {{ required "auditGovernance.baseURL is required when enabled" .Values.auditGovernance.baseURL | quote }}
            - name: AUDIT_GOVERNANCE_TOKEN_URL
              value: {{ required "auditGovernance.tokenURL is required when enabled" .Values.auditGovernance.tokenURL | quote }}
            - name: AUDIT_GOVERNANCE_BINDINGS_FILE
              value: {{ required "auditGovernance.mountPath is required when enabled" .Values.auditGovernance.mountPath | quote }}
            - name: AUDIT_GOVERNANCE_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "auditGovernance.hmacSecretName is required when enabled" .Values.auditGovernance.hmacSecretName }}
                  key: {{ required "auditGovernance.hmacSecretKey is required when enabled" .Values.auditGovernance.hmacSecretKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if .Values.auditGovernance.enabled }}
            - name: audit-governance-bindings
              mountPath: {{ required "auditGovernance.mountPath is required when enabled" .Values.auditGovernance.mountPath }}
              subPath: {{ required "auditGovernance.bindingsKey is required when enabled" .Values.auditGovernance.bindingsKey }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        # Writable scratch for multipart upload buffering under a read-only rootfs.
        - name: tmp
          emptyDir: {}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "aero-vault.pvcName" . }}
        {{- end }}
        {{- if .Values.auditGovernance.enabled }}
        - name: audit-governance-bindings
          configMap:
            name: {{ required "auditGovernance.bindingsConfigMap is required when enabled" .Values.auditGovernance.bindingsConfigMap }}
            defaultMode: 0444
            items:
              - key: {{ required "auditGovernance.bindingsKey is required when enabled" .Values.auditGovernance.bindingsKey }}
                path: {{ required "auditGovernance.bindingsKey is required when enabled" .Values.auditGovernance.bindingsKey }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
