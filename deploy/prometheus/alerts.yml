# Prometheus alerting rules for aero-vault.
#
# Series referenced here are exported by the OpenTelemetry Prometheus exporter
# (PROMETHEUS_ENABLED=true). OTel maps instrument names dots→underscores and
# appends _total to monotonic counters, so internal/telemetry's "ai.cost_micros"
# becomes "ai_cost_micros_total", etc.
#
# Load via prometheus.yml `rule_files: [alerts.yml]`. Validate with:
#   promtool check rules deploy/prometheus/alerts.yml

groups:
  - name: aero-vault-http
    rules:
      - alert: HighServer5xxRate
        expr: |
          sum(rate(http_server_requests_total{status="500"}[5m]))
            / clamp_min(sum(rate(http_server_requests_total[5m])), 1e-9)
            > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Elevated 5xx rate on aero-vault"
          description: "More than 5% of requests returned 5xx over the last 5m (for 10m)."

      - alert: HighRequestLatencyP95
        expr: |
          histogram_quantile(0.95, sum(rate(http_server_duration_ms_bucket[5m])) by (le)) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 request latency above 1s"
          description: "95th-percentile HTTP handler latency exceeded 1000ms for 10m."

  - name: aero-vault-ai-cost
    rules:
      # Per-tenant AI spend rate (USD/hour) derived from cost_micros (USD millionths).
      - alert: TenantAISpendRateHigh
        expr: |
          sum by (tenant) (rate(ai_cost_micros_total[1h])) * 3600 / 1e6 > 5
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Tenant {{ $labels.tenant }} AI spend > $5/hour"
          description: "Estimated AI spend rate for tenant {{ $labels.tenant }} exceeded $5/hour for 30m. Check AI_TENANT_DAILY_BUDGET_USD."

      - alert: AITokenThroughputSpike
        expr: sum(rate(ai_tokens_total[5m])) > 10000
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "High AI token throughput"
          description: "Aggregate token consumption exceeded 10k tokens/s for 15m."

  - name: aero-vault-integrity
    rules:
      # Orphan blobs being detected faster than they are cleaned up = storage leak.
      - alert: OrphanBlobsAccumulating
        expr: |
          increase(reconcile_orphan_blobs_total[1h])
            - increase(reconcile_orphan_blobs_deleted_total[1h]) > 100
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Orphan blobs accumulating without cleanup"
          description: "Reconcile detected >100 more orphan blobs than it deleted over 1h. Enable RECONCILE_DELETE_ORPHAN_BLOBS or investigate failed writes."

      - alert: IdempotencyReplayStorm
        expr: sum(rate(idempotency_replays_total[5m])) > 50
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "High idempotent-replay rate"
          description: "Clients are retrying writes heavily (>50 replays/s for 10m); check upstream timeouts/proxies."

      - alert: EventBusDropping
        expr: sum(rate(events_dropped_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "In-process event bus is dropping events"
          description: "Subscribers are falling behind the 64-deep buffer (SSE/indexer/webhook lag). The durable event table is unaffected, but live consumers miss events — scale consumers or enable a cross-instance transport."

      - alert: WebhookRetryRateHigh
        expr: sum(rate(webhook_retries_total[15m])) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High webhook retry rate"
          description: "Webhook delivery retries exceed 10/15m. Check webhook endpoint availability and network connectivity."

      # IncEventOutboxFailed (internal/telemetry: event_outbox.failed_total):
      # deleted@1.1 facts reaching terminal 'failed' — L2 401/403 (immediate,
      # H2) or maxAttempts exhausted (F1). Rows are retained 7d then pruned
      # (PruneEventOutbox, eventOutboxFailedRetain); the 7d window is the
      # documented delivery-recovery SLA — beyond it the only durable trace is
      # the authoritative L0 audit_log row written in the delete transaction.
      - alert: EventOutboxTerminalFailures
        expr: sum(rate(event_outbox_failed_total[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Event outbox facts reached terminal failed state"
          description: "deleted@1.1 facts hit terminal 'failed' (L2 401/403 or maxAttempts exhausted). Rows are retained 7d (delivery-recovery SLA) then pruned; L0 audit_log remains authoritative. Replay within 7d or accept the gap."

      - alert: ScrubFoundCorruptObjects
        expr: sum(increase(scrub_total{status="corrupt"}[1h])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Data integrity scrub detected corrupt objects in the last hour"
          description: "The periodic data-integrity scrub (RECONCILE_SCRUB_ENABLED) found one or more objects whose stored MD5 does not match the content. Immediate investigation required. Objects have been marked `_aero_scrub_status=corrupt` and a GET on them returns 410 Gone."

  - name: aero-vault-ai-latency
    rules:
      - alert: HighEmbedLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(ai_embed_duration_ms_bucket[5m])) by (le, model)) > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Embedding p95 latency > 500ms for model {{ $labels.model }}"
          description: "95th-percentile embedding latency exceeded 500ms for 10m. Check the embedding provider or increase AI_EMBED_CACHE_SIZE."

      - alert: HighSearchLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(ai_search_duration_ms_bucket[5m])) by (le, mode)) > 2000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Search p95 latency > 2s for mode {{ $labels.mode }}"
          description: "95th-percentile retrieval latency exceeded 2s for 10m. Consider enabling AI_SEARCH_CACHE_SIZE or switching to an external vector store."

      - alert: JobQueueDepthHigh
        expr: jobs_pending > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Job queue depth > 1000"
          description: "Pending job backlog exceeded 1000 for 5m. Consider increasing JOBS_WORKERS or setting JOBS_MAX_DEPTH to shed load."

  - name: aero-vault-ai-search
    # D1 drill: a failed hybrid-search modality degrades to single-modality
    # results (200 from the healthy half) instead of 500 — a degrade the 5xx
    # alerts can no longer see. The counter is the only visibility contract:
    # rate > 0 for 5m means the embedder / vector backend / lexical backend
    # has been failing (HTTP 200 still served; root cause in warn logs
    # "embed query:" / "search chunks:" / "lexical search:"). `> 0 for 5m`
    # matches the EventBusDropping idiom — a flapping embedder alerting on
    # every blip is correct behavior, not noise.
    rules:
      - alert: SearchDegraded
        expr: sum by (reason) (rate(ai_search_degraded_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hybrid search degraded to single-modality results (reason={{ $labels.reason }})"
          description: "reason=embed → embedding provider failed; reason=vector → vector index backend (pgvector/Qdrant) failed; reason=lexical → lexical backend (pgFTS) failed. HTTP 200 still served from the healthy half. Root cause in warn logs: 'embed query:'/'search chunks:'/'lexical search:'."

  - name: aero-vault-audit-governance
    # B3-2 (D1): a stalled audit relay degrades instead of failing /readyz.
    # Two signals feed the alert: the backlog-age gauge
    # (audit_governance_backlog_age_seconds, oldest pending non-terminal fact;
    # 450s = maxLag default 900 × 0.5 early warning) and the degraded flag
    # (audit_governance_degraded, cache-fed 0/1: lag > configured maxLag or
    # relay-store probe timeout — age unknown → 0). The OR is deliberate: a
    # probe timeout records age 0, so the age arm alone would reset `for: 10m`
    # on every timeout sample; the degraded arm keeps accumulation true until a
    # genuinely healthy probe (age ≤ 450 AND degraded=0) — no starvation reset.
    rules:
      - alert: AuditGovernanceBacklogDegraded
        expr: audit_governance_backlog_age_seconds > 450 OR audit_governance_degraded == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Audit governance relay backlog degraded"
          description: "Oldest pending audit fact exceeded the 450s early warning (maxLag default 900 × 0.5), or the relay store probe degraded (degraded=1: lag > configured maxLag, or store probe timeout — age unknown). /readyz stays 200 (degraded); check relay_attempted/failed counters and the sink."

      # Fail-closed activation gate companion: an enabled relay with zero
      # bound tenants is never a healthy steady state — the empty-manifest
      # boot is refused unless AUDIT_GOVERNANCE_DRAIN was set, so a present
      # bound_tenants series at 0 means the drain transition (legit disable
      # flow, draining=1) or a stale flag + empty manifest replay (draining=0
      # — the silent-off condition). The pair is the only positive signal;
      # annotations direct the operator to audit_governance_draining.
      - alert: AuditGovernanceEnabledUnbound
        expr: audit_governance_bound_tenants == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Audit governance relay enabled with zero bound tenants"
          description: "An enabled audit governance relay reports no bound tenants for 10m. audit_governance_draining==1: in-progress drain transition (disable flow step 2 — complete with ENABLED=false and clear AUDIT_GOVERNANCE_DRAIN + the empty manifest). audit_governance_draining==0: stale AUDIT_GOVERNANCE_DRAIN with an empty manifest replay — clear the flag and remove the manifest, or restore bindings at a higher revision."

  - name: aero-vault-thumbnail-cache
    rules:
      # Server-side thumbnail cache hit-ratio floor: with THUMBNAIL_CACHE_BYTES
      # enabled, a sustained low hit ratio means the key space is thrashing
      # (evictions racing requests — LRU working set > budget) or the admission
      # gates are accidentally excluding the dominant path. The denominator
      # guard (sum of rates > 0) keeps the rule silent on idle caches and on
      # disabled caches (no counters emitted).
      - alert: ThumbnailCacheHitRatioLow
        expr: |
          (sum by (instance) (rate(thumbnail.cache.hits_total[5m])) /
           (sum by (instance) (rate(thumbnail.cache.hits_total[5m])) +
            sum by (instance) (rate(thumbnail.cache.misses_total[5m])))) < 0.5
            and on(instance) (sum by (instance) (rate(thumbnail.cache.hits_total[5m]))
            + sum by (instance) (rate(thumbnail.cache.misses_total[5m]))) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Thumbnail cache hit ratio below 50% for 15m"
          description: "The server-side thumbnail cache is serving less than half of requests from cache (hits/(hits+misses) < 0.5 for 15m while active). Check THUMBNAIL_CACHE_BYTES sizing against the working set and thumbnail.cache.evictions_total; raise the budget or review the admission gates (SSE-C / multipart objects bypass the cache by design)."

      # Client-side revalidation fan-out ceiling: bounded freshness
      # (max-age=300, must-revalidate on the derived thumbnail) converts
      # silent cache hits into origin conditionals — up to 288/day per
      # client-URL. Each certified 304 costs three repo point reads (no
      # stream, no decode slot); the measured per-core conditional ceiling is
      # ~1.5-2k/s, so a sustained aggregate rate beyond 2000/s signals a
      # misconfigured client fleet, a CDN that stopped caching, or a
      # freshness re-tune. The counter is emitted only with
      # PROMETHEUS_ENABLED=true.
      - alert: ThumbnailRevalidationRateHigh
        expr: sum(rate(thumbnail_304_total[5m])) > 2000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Thumbnail revalidation rate above 2000/s for 15m"
          description: "Sustained If-None-Match revalidations of derived thumbnails exceeded 2000/s over 5m (15m sustained). Bounded client freshness (max-age=300, must-revalidate) makes this the dominant read path per active client per thumbnail URL. Mitigation: arm RATE_LIMIT_RPS for per-tenant ceilings, front high-fan-out deployments with a CDN edge (one conditional per URL per 300 s instead of per client), enable THUMBNAIL_CACHE_BYTES, and inspect the access log for a misconfigured client fleet. The 300 s bound is the single package constant thumbFreshnessMaxAge."
